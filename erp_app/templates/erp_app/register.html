{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralith ERP | Register</title>
    <link rel="stylesheet" href="{% static 'erp_app/css/style.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
        .login-card { background: var(--surface); border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .login-brand { text-align: center; margin-bottom: 30px; }
        .login-brand img { width: 60px; margin-bottom: 10px; }
        .login-brand h1 { font-size: 22px; color: var(--auralith-blue); }
        .login-brand p { font-size: 13px; color: #64748B; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dark); }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: var(--auralith-blue); box-shadow: 0 0 0 3px rgba(26,75,141,0.1); }
        .login-btn { width: 100%; background: var(--auralith-blue); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #123a6b; }
        .alert { background: #FEF2F2; color: #991B1B; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <img src="{% static 'erp_app/images/AURALITH_logo.png' %}" alt="Auralith Bit">
                <h1>Create Account</h1>
                <p>Register a new ERP user</p>
            </div>
            {% if messages %}
                {% for message in messages %}
                <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" maxlength="150" value="{{ form_data.username|default:'' }}" required>
                    <small class="field-error" id="usernameError" style="display:none;color:#dc2626;font-size:12px;margin-top:4px;"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email address" maxlength="254" value="{{ form_data.email|default:'' }}" required>
                    <small class="field-error" id="emailError" style="display:none;color:#dc2626;font-size:12px;margin-top:4px;"></small>
                </div>
                <div class="form-group" style="position:relative;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" maxlength="128" required>
                    <button id="togglePassword" type="button" style="position:absolute;right:12px;top:36px;border:none;background:none;color:#64748B;cursor:pointer;font-size:14px;">Show</button>
                    <small class="field-error" id="passwordError" style="display:none;color:#dc2626;font-size:12px;margin-top:4px;"></small>
                </div>
                <div class="form-group" style="position:relative;">
                    <label for="password2">Confirm Password</label>
                    <input type="password" id="password2" name="password2" placeholder="Confirm your password" minlength="8" maxlength="128" required>
                    <small class="field-error" id="password2Error" style="display:none;color:#dc2626;font-size:12px;margin-top:4px;"></small>
                </div>
                <button type="submit" class="login-btn"><i class="ph ph-user-plus"></i> Register</button>
            </form>
            <div style="margin-top:18px;font-size:13px;color:#475569;text-align:center;">
                Already have an account? <a href="{% url 'login' %}" style="color:#1D4ED8;text-decoration:none;">Sign in</a>
            </div>
            <div style="margin-top:8px;font-size:13px;color:#475569;text-align:center;">
                Staff member? <a href="{% url 'staff_register' %}" style="color:#1D4ED8;text-decoration:none;">Staff registration</a>
            </div>
        </div>
    </div>
    <script>
        const passwordField = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        if (passwordField && togglePassword) {
            togglePassword.addEventListener('click', function() {
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    this.textContent = 'Hide';
                } else {
                    passwordField.type = 'password';
                    this.textContent = 'Show';
                }
            });
        }
        document.querySelector('.login-card form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const ue = document.getElementById('usernameError');
            const ee = document.getElementById('emailError');
            const pe = document.getElementById('passwordError');
            const p2e = document.getElementById('password2Error');
            const errors = [ue, ee, pe, p2e];
            errors.forEach(el => { el.style.display = 'none'; });
            let valid = true;
            if (!username) { ue.textContent = 'Username is required.'; ue.style.display = 'block'; valid = false; }
            else if (/^[0-9]/.test(username)) { ue.textContent = 'Username must not start with a number.'; ue.style.display = 'block'; valid = false; }
            if (!email) { ee.textContent = 'Email is required.'; ee.style.display = 'block'; valid = false; }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { ee.textContent = 'Enter a valid email address.'; ee.style.display = 'block'; valid = false; }
            if (!password) { pe.textContent = 'Password is required.'; pe.style.display = 'block'; valid = false; }
            else if (password.length < 8) { pe.textContent = 'Password must be at least 8 characters.'; pe.style.display = 'block'; valid = false; }
            if (!password2) { p2e.textContent = 'Please confirm your password.'; p2e.style.display = 'block'; valid = false; }
            else if (password !== password2) { p2e.textContent = 'Passwords do not match.'; p2e.style.display = 'block'; valid = false; }
            if (!valid) e.preventDefault();
        });
        document.addEventListener('wheel', function(e) {
            if (e.target.type === 'number') e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
