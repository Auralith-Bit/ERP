<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralith ERP | Login</title>
    <link rel="stylesheet" href="{% static 'erp_app/css/style.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }
        .login-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-brand img { width: 60px; margin-bottom: 10px; }
        .login-brand h1 { font-size: 22px; color: var(--auralith-blue); }
        .login-brand p { font-size: 13px; color: #64748B; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dark); }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus { border-color: var(--auralith-blue); box-shadow: 0 0 0 3px rgba(26,75,141,0.1); }
        .login-btn {
            width: 100%;
            background: var(--auralith-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover { background: #123a6b; }
        .alert { background: #FEF2F2; color: #991B1B; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <img src="{% static 'erp_app/images/AURALITH_logo.png' %}" alt="Auralith Bit">
                <h1>AURALITH BIT</h1>
                <p>Design. Develop. Deliver</p>
            </div>
            {% if messages %}
                {% for message in messages %}
                <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group" style="position:relative;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button id="togglePassword" type="button" style="position:absolute;right:12px;top:36px;border:none;background:none;color:#64748B;cursor:pointer;font-size:14px;">Show</button>
                </div>
                <button type="submit" class="login-btn"><i class="ph ph-sign-in"></i> Sign In</button>
            </form>
            <div style="display:flex;justify-content:space-between;margin-top:18px;font-size:13px;color:#475569;">
                <a href="{% url 'password_reset' %}" style="color:#1D4ED8;text-decoration:none;">Forgot password?</a>
                <a href="{% url 'register' %}" style="color:#1D4ED8;text-decoration:none;">Register now</a>
            </div>
        </div>
    </div>
    <script>
        const passwordField = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        if (passwordField && togglePassword) {
            togglePassword.addEventListener('click', function() {
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    this.textContent = 'Hide';
                } else {
                    passwordField.type = 'password';
                    this.textContent = 'Show';
                }
            });
        }
    </script>
</body>
</html>
