{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralith ERP | New Password</title>
    <link rel="stylesheet" href="{% static 'erp_app/css/style.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--auralith-light); }
        .login-card { background: white; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .login-brand { text-align: center; margin-bottom: 30px; }
        .login-brand img { width: 60px; margin-bottom: 10px; }
        .login-brand h1 { font-size: 22px; color: var(--auralith-blue); }
        .login-brand p { font-size: 13px; color: #64748B; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dark); }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: var(--auralith-blue); box-shadow: 0 0 0 3px rgba(26,75,141,0.1); }
        .login-btn { width: 100%; background: var(--auralith-blue); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #123a6b; }
        .alert { background: #FEF2F2; color: #991B1B; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
        .alert-success { background: #F0FDF4; color: #166534; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <img src="{% static 'erp_app/images/AURALITH_logo.png' %}" alt="Auralith Bit">
                <h1>Set New Password</h1>
                <p>Choose a strong password for your account</p>
            </div>
            {% if messages %}
                {% for message in messages %}
                <div class="{% if message.tags == 'success' %}alert-success{% else %}alert{% endif %}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="password2">Confirm Password</label>
                    <input type="password" id="password2" name="password2" placeholder="Re-enter new password" minlength="8" required>
                </div>
                <button type="submit" class="login-btn"><i class="ph ph-key"></i> Reset Password</button>
            </form>
        </div>
    </div>
</body>
</html>
